name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Don't install the local git hook on runners.
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Not blocking. On this runner herbstluftwm tiles the two parallel
    # Obsidian windows into 1274x480 halves of the 1280x1024 screen and
    # ignores a window's own resizes, so a few layout-dependent specs fail
    # here only. The suite also runs on Windows, where they pass. Build,
    # lint, unit tests and commitlint stay blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Resolve "earliest" (the manifest floor) and "latest" to concrete
      # versions and key the download cache on them.
      - name: Get Obsidian cache key
        run: |
          npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          CI: true
      - name: Cache Obsidian
        uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      # Obsidian needs a display. xvfb is the virtual display, herbstluftwm
      # the window manager some Obsidian features expect.
      - name: Set up virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm x11-xserver-utils
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: End-to-end tests (Obsidian 1.7.4 and latest)
        run: npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
